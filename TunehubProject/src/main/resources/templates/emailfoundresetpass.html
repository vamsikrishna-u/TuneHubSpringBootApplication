<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<style type="text/css">
body{text-align : center;background-color:lightblue;}
.button{background-color:green;font-size:20px;color:white
}
</style>
</head>
<body>

<h1 style="color:red;">Reset Password</h1>
<form th:action="@{/passwordresetformaction}" method="post">
<label>Current Password*</label>
<input type="password" name="currentPassword" required><br><br>
<label style="padding-right:20px;">Enter New Password*</label>
<input type="password" name="pass1" required><br><br>
<label>Re-Enter New Password*</label>
<input type="password" name="passreset" required><br><br>
<p th:if="${passwordMismatch}" style="color:red;">Passwords do not match.</p>
<p th:if="${currentPasswordInvalid}" style="color:red;">Current password is incorrect.</p>
<button class="button">Submit</button>

</form>
</body>
</html>
