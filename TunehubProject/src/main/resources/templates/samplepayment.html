<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
	
	<title>Payment</title>
	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

</head>
<body>
<div>

		<!-- <h1>Why premium ? </h1>
		<p>text...................</p> -->
		
    	<form id="payment-form">
	        <button type="submit" class="buy-button" >BUY</button>
	    </form>
   
</div>

<script th:inline="javascript">
const csrfToken = document.querySelector('meta[name="_csrf"]').content;
const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
$.ajaxSetup({beforeSend: function(xhr) { xhr.setRequestHeader(csrfHeader, csrfToken); }});

$(document).ready(function() {
    $(".buy-button").click(function(e) {
        e.preventDefault();
        var form = $(this).closest('form');
        
        
        createOrder();
    });
});

function createOrder() {
	
    $.post("/createOrder")
        .done(function(order) {
            var options = {
				"key": "[[${razorpayKeyId}]]",
                "amount": order.amount,
                "currency": order.currency,
                "name": "Tune Hub",
                "description": "TuneHub Premium",
                "order_id": order.orderId,
                "handler": function (response) {
                    verifyPayment(response.razorpay_order_id, response.razorpay_payment_id, response.razorpay_signature);
                },
                "modal": {
                    "ondismiss": function () {
                        alert("Payment was not completed. You can try again.");
                    }
                },
                "theme": {
                    "color": "#F37254"
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.on("payment.failed", function () {
                alert("Payment failed. Premium access was not activated. Please retry.");
            });
            rzp1.open();
        })
        .fail(function(error) {
            console.error("Error:", error);
        });
}

function verifyPayment(orderId, paymentId, signature) {
    $.ajax({
        url: "/verify",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ orderId: orderId, paymentId: paymentId, signature: signature })
    }).done(function(result) {
        if (result.verified) {
            window.location.href = "/showallsongs";
        } else {
            alert(result.message);
        }
    }).fail(function(xhr) {
        var response = xhr.responseJSON;
        alert(response && response.message
            ? response.message
            : "Payment verification is temporarily unavailable. Please retry.");
    });
}
</script>
</body>
</html>
